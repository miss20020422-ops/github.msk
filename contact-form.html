<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>

    <link rel="stylesheet"href="css/contact.css">
    <link rel="stylesheet" href="css/portoforio.css">
</head>

<body>
  <header class="header">
    <div class="header-inner">
      <h1 class="logo">
        <a href="#top">FORMS</a>
      </h1>

　 　<nav class="nav">
      <a href="#profile">Profile</a>
      <a href="#skill">Skill</a>
      <a href="#works">Works</a>
      <a href="contact-form.html">Contact</a>
     </nav>
    </div>
  </header>

<main>
   <section id="contact-form" class="contact-page">

   <div class="contact-inner">

    <div class="section-title">
      <h2>Contact</h2>
      <span>お問い合わせ</span>
    </div>

    <p class="contact-lead">
      制作の依頼・ご相談などお気軽にお問い合わせください。<br>
      下記フォームよりわかる範囲でご記入ください。<br>
      必須項目は必ずご記入をお願いします。
    </p>

    <form action="https://ssgform.com/s/NrY6ovsQsxkH"
          method="POST"
          class="contact-form"
    >

      <label>
        貴社名
        <input type="text"name="company">
      </label>

      <label>
        お名前
        <input type="text" name="name"required>
      </label>

      <label>
        メールアドレス
        <input type="email" name="email"required>
      </label>

      <label>
        電話番号
        <input type="tel"name="tel">
      </label>

      <label>
        お問合せ内容
        <textarea name="message"required></textarea>
      </label>

      <button type="submit">
        内容を送信する
      </button>

    </form>

   </div>

   </section>
</main>

</body>
</html>
